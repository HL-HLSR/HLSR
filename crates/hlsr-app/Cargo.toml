[package]
name = "hlsr-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Бинарник лаунчера: выбор режима, порядок запуска, фасады, окно GPUI.

[[bin]]
name = "hlsr"
path = "src/main.rs"

[features]
# Отладочные возможности (HLSR_SMOKE_*, перенаправления режимов…) в сборке выпуска; снимок окна —
# render_to_image GPUI (test-support).
dev-hooks = [
    "hlsr-core/dev-hooks",
    "hlsr-delivery/dev-hooks",
    "hlsr-demo/dev-hooks",
    "hlsr-gpui/dev-hooks",
    "hlsr-online/dev-hooks",
    "hlsr-platform/dev-hooks",
    "hlsr-update/dev-hooks",
]

[dependencies]
hlsr-core.workspace = true
hlsr-delivery.workspace = true
hlsr-demo = { path = "../hlsr-demo" }
hlsr-gpui = { path = "../hlsr-gpui" }
hlsr-online = { path = "../hlsr-online" }
hlsr-platform = { path = "../hlsr-platform" }
hlsr-ui = { path = "../hlsr-ui" }
hlsr-update.workspace = true
gpui.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
thiserror.workspace = true
serde_json.workspace = true
# Значок трея `icons/hlsrc.png`.
image = { workspace = true, features = ["png"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb.workspace = true
# Трей: StatusNotifierItem.
ksni.workspace = true
rfd = { workspace = true, features = ["xdg-portal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# Диалоги файлов и папок (доставка, отчёт диагностики, установщик).
rfd.workspace = true
# Трей: значок и меню в цикле сообщений GPUI.
tray-icon.workspace = true

[build-dependencies]
# Значок, VERSIONINFO и манифест exe (задача 3).
winresource.workspace = true

[dev-dependencies]
tempfile.workspace = true
