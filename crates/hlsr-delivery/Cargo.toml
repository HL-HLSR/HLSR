[package]
name = "hlsr-delivery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Доставка игр без интерфейса: то же, что game-delivery 0.4.7.

[features]
# Отладочные возможности (QA-канал, локальный HTTP…) в сборке выпуска.
# «production» 0.4.7 (NODE_ENV) — это выпуск без этого признака.
dev-hooks = ["hlsr-core/dev-hooks"]

[dependencies]
hlsr-core.workspace = true
base64.workspace = true
chrono.workspace = true
crc32fast.workspace = true
flate2.workspace = true
getrandom.workspace = true
regex.workspace = true
regress.workspace = true
serde.workspace = true
url.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tracing.workspace = true
reqwest.workspace = true
rustls.workspace = true
bytes.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net"] }
