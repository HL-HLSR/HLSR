[package]
name = "hlsr-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Запуск и платформа без интерфейса: процессы игр, Steam, Proton — то, что делают game-delivery
# (запуск), linux/ и profile/ 0.4.7. Реализует порты `hlsr-delivery::ports`.

[features]
# Отладочные возможности (тестовый запуск QA) в сборке выпуска.
# «production» 0.4.7 (NODE_ENV) — это выпуск без этого признака.
dev-hooks = ["hlsr-core/dev-hooks", "hlsr-delivery/dev-hooks"]

[dependencies]
hlsr-core.workspace = true
hlsr-delivery.workspace = true
base64.workspace = true
getrandom.workspace = true
regex.workspace = true
reqwest.workspace = true
rustls-platform-verifier.workspace = true
rustls.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "net", "process", "rt", "sync", "time"] }
url.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "process", "rt", "rt-multi-thread", "sync", "test-util", "time"] }

# Тест оверлея LiveSplit: настоящая загруженная DLL не заменяется в папке игры.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_LibraryLoader", "Win32_System_StationsAndDesktops"] }
