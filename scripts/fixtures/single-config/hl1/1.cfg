name prolert



//Gauss Boost 180°

alias "_taubo" ""
alias "_taubofunc" "cl_pitchup 180;cl_pitchdown -180;-attack2;wait;cl_pitchup 89;cl_pitchdown 89;force_centerview"
alias "+tau" "+attack2;alias _taubo _taubofunc"
alias "-tau" "_taubo;alias _taubo"
bind "mouse4" "save oarEnt; bind mouse4 +tau; speak fvox/beep; say TAO"



//Korobka Boost

alias obboshoot "+use;w 10;-use;+attack2;+jump;w;-attack2;-jump"
bind n "obboshoot"



//RP
alias lcboost "fps_max 100; cl_pitchdown -20; cl_pitchup 20; +duck; +jump; w 5; -attack; w 15; -jump; cl_pitchup 89; cl_pitchdown 89; w 30; -duck; bind mouse2 +attack2"
bind j "bind mouse2 lcboost; speak fvox/beep; say READY FOR BOOST"



alias st0 "bxt_autojump 1; fps_max 100; alias stmove +forward; w 40; alias stskip st1" // 1
alias st1 "weapon_gauss;+duck;w 146;-duck;-forward;alias stskip st2;alias stmove +moveright" // 2+1
alias st2 "+attack2;w 150;-moveright;+use;w 2;-use;alias stskip st3;alias stmove +forward" // 2+1
alias st3 "w 15;+jump;cl_pitchup 180;cl_pitchdown -180;-attack2;w;cl_pitchup 89;cl_pitchdown 89;force_centerview;-forward;w 60;alias stskip st4;alias stmove +moveright" // 2+1
alias st4 "alias stmove +right; alias stskip st5" // 2+1
alias st5 "alias stmove; w 26;-right;-moveright;w 30;-jump;cl_pitchup -89;cl_pitchdown 89;w 44;cl_pitchup 89;weapon_shotgun;alias stskip" // 2+1

alias stskip st0
alias stmove


// binds
bind ";" stskip
bind "'" stmove

//jorikgrozniy script
bind = "exec p2pv2.cfg;say exec truba"
bind - "exec 1.cfg;say RESET CFG"



//Basic Binds

alias "start_run" "sv_cheats 0; exec autoexec.cfg; exec 1.cfg; bxt_hud_timer 0; map c1a0; switch_to_save; bxt_timer_reset; bxt_timer_start; bxt_autorecord myrun"
alias "show_crosshair" "load crosshair"
bind "p" "start_run;exec 1.cfg;bxt_hud_timer 0"
bind "[" "show_crosshair"
alias fix "-jump;-duck;-bxt_tas_jumpbug;+mlook;-moveleft;-moveright;-forward;-back;-left;-right;-speed;-attack;-attack2;-lookup;-lookdown;-use;-moveup;-movedown; cl_pitchup 89; cl_pitchdown 89; fps_max 100"
bind backspace "fix"

gl_texturemode "GL_NEAREST_MIPMAP_NEAREST"

bind z "fps_max 20"
bind x "fps_max 100;volume 0.02"

bxt_autojump 1
bxt_hud_viewangles 1
default_fov 110
cl_bob 0
brightness 2
lightgamma 2.5
gamma 3
bind mwheeldown +duck
bind mwheelup +duck
bind y "save x;load x"

crosshair 0
bxt_cross 1
bxt_cross_color "255 255 255"
bxt_cross_gap "-4"
bxt_cross_size "7"
bxt_viewmodel_ofs_up -2 
bxt_viewmodel_ofs_forward 2

bind capslock "weapon_crowbar"
bind 1 "weapon_9mmhandgun"
bind 2 "weapon_357"
bind 3 "weapon_9mmAR"
bind 4 "weapon_shotgun"
bind 5 "weapon_handgrenade"
bind g "weapon_gauss"
bind 7 "weapon_tripmine"
bind 8 "weapon_hornetgun"
bind 6 "weapon_satchel"
bind c "save quick"
bind v "load quick"
bind t "impulse 100"
bind [ "exec tc_n.cfg;say exec telega"
bind mouse5 "+bxt_tas_jumpbug"
bind m "fps_max 10"
bind o "fps_max 4"


//SCRIPTS BIND
alias puskip_d "fps_max 100; save autosave;weapon_shotgun;-jump;-moveright;-moveleft;w 300;+use;w 7;-use;+jump;wait;-jump;+attack2;wait;-attack2;+duck;w 35;-duck;weapon_tripmine"
bind h "puskip_d"


//FAF 
alias "faf_f" "cl_pitchup 89.999;fps_max 100;save autosave;weapon_crowbar;+attack;w 100;-moveleft;-moveright;w 180;-attack;force_centerview;weapon_9mmAR;cl_pitchdown 180;cl_pitchup -179;w 40;cl_pitchup 89;cl_pitchdown 89;w 30;+jump;+duck;w;cl_pitchdown 136;cl_pitchup -135;-forward;+attack2;w 30;-attack2;cl_pitchup 89;cl_pitchdown 89;force_centerview;-jump;-duck;w 10;+duck;w 16;-duck;weapon_hornetgun"
bind u "faf_f"


//NADE BOOST script
alias lb1 "fps_max 100; sensitivity 0; cl_pitchdown 86.5; cl_pitchup -86.5; w 50; +attack; alias labo2 lb2; alias labo2mv +back" // 2
alias lb2 "w 25; -attack; w 4; +duck; w 13; -back; weapon_9mmAR; w 35; cl_pitchdown 127; cl_pitchup -127; alias labo2mv +forward; alias labo2 lb3" // 12
alias lb3 "w 15; +attack2; w 4; -attack2; alias labo2mv +moveleft; alias labo2 lb4" // 12
alias lb4 "alias labo2; alias labo2mv; w 40; -moveleft; -forward; -duck; cl_pitchdown 89; cl_pitchup 89; w 20; fps_max 4; w; fps_max 100; labosens" // 12

alias labo2 lb1
alias labo2mv


// settings
alias labosens "sensitivity 3"

// binds
bind f8 labo2
bind f7 labo2mv




//SALO SKIP
alias mtg mtg1
alias mtg1 "fps_max 100;+duck;w 50;alias mtg mtg2"
alias mtg2 "+use;w 18;-use;w 60;-duck;alias mtg mtg1"


//OBBO
alias "obbo2000" "+use;w 12;-use;+jump;wait;-jump"
alias "obbo1000" "+use;w 8;-use;+jump;wait;-jump"



//REBINDS
alias fps4 "fps_max 4; w; fps_max 100"


alias re4 "re41"
alias re41 "bind f fps4; say 4fps_script; alias re4 re42"
alias re42 "bind f obbo1000; say obbo1000; alias re4 re44"
alias re44 "bind f obbo2000; say obbo2000; alias re4 re45"
alias re45 "bind f mtg; say meatboost; alias re4 re41" 

alias jumpbg "fps_max 90.90909"
alias fps666 "fps_max 66.66666"
alias fps5 "fps_max 55.55555"


alias re5 "re51"
alias re51 "bind tab fps5; say FPS 5555555; alias re5 re52"
alias re52 "bind tab jumpbg; say SOILDER; alias re5 re53"
alias re53 "bind tab fps666; say fps XEN; alias re5 re51"


bind alt "re4"
bind b "re5"
bind mouse3 "+bxt_tas_ducktap"

bind tab "fps666"
bind f "fps4"



alias +usespam "alias _zspecial @use;@use1"
alias -usespam "alias _zspecial;-use"
alias @use1 "+use;alias @use @use2;bxt_append _zspecial"
alias @use2 "w;alias @use @use3;bxt_append _zspecial"
alias @use3 "-use;alias @use @use4;bxt_append _zspecial"
alias @use4 "w;alias @use @use1;bxt_append _zspecial"

bind e "+use"



//GEM SKIPS
alias load_bp "load bpEnt"
alias load_qe1 "load qe1Ent"
alias load_oar "load oarEnt"
alias load_qe2 "load qe2Ent"
alias load_rp "load rpEnt"

alias all_save_bp "save bpEnt"
alias all_save_qe1 "save qe1Ent"
alias all_save_oar "save oarEnt"
alias all_save_qe2 "save qe2Ent"

alias switch_to_load "bind f1 load_bp; bind f2 load_qe1; bind f3 load_oar; bind f4 load_qe2; bind f5 load_rp"
alias save_rp_and_switch "save rpEnt; say CHANGED BINDS; switch_to_load"
alias switch_to_save "bind f1 all_save_bp; bind f2 all_save_qe1; bind f3 all_save_oar; bind f4 all_save_qe2; bind f5 save_rp_and_switch"

bind f1 "save bpEnt"
bind f2 "save qe1Ent"
//bind f3 "save oarEnt"
bind f4 "save qe2Ent"
bind f5 "save rpEnt; say BINDS CHANGED; switch_to_load"
bind f6 "save reshetka; say BIND CHANGED; bind f6 oshmetki"

alias oshmetki "load reshetka; bind mwheelup +jump"

//GONARCH AGRO
alias _saveload2 "alias auto_alias; w 27; save quick; fps_max 100; load quick; w 25; speak fvox/beep; say GO; w 90; alias gonch gonch1; alias gonchmv +forward"

alias gonch1 "weapon_gauss; w 30; +attack2; w 80; +jump; w 45; cl_pitchup 180; cl_pitchdown -180; -attack2; w; cl_pitchup 89; cl_pitchdown 89; force_centerview; w 150; -jump; w 80; alias gonchmv +right; alias gonch gonch2"
alias gonch2 "w 5; -right; w 95; -forward; weapon_9mmAR; save quick; alias gonch; alias gonchmv"

alias gonch
alias gonchmv

bind leftarrow "alias auto_alias _saveload2"
bind downarrow gonchmv
bind rightarrow gonch

echo EXECED